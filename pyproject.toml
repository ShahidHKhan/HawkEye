[project]
name = "hawkeye"
version = "0.1.0"
description = "Internal IT help desk knowledge assistant for SUNY New Paltz technicians"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # App + retrieval pipeline
    "gradio>=6.20.0",
    "google-genai>=2.11.0",  # ingest.py catches its ServerError directly
    "httpx>=0.28.1",  # ...and httpx's TimeoutException
    "langchain-core>=1.2.0",
    "langchain-google-genai>=4.2.7",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "tenacity>=9.1.4",
    "tqdm>=4.67.0",
    # Knowledge Map tab (PCA + Plotly)
    "numpy>=2.5.1",
    "plotly>=6.9.0",
    "scikit-learn>=1.9.0",
    # Scraper + markdown mirror
    "beautifulsoup4>=4.15.0",
    "markdownify>=1.2.3",
    "python-frontmatter>=1.3.0",
    "requests>=2.34.2",
    # Evaluation dashboard
    "pandas>=3.0.3",
]

[dependency-groups]
dev = [
    # The day1-3 R&D notebooks
    "ipykernel>=7.3.0",
    # Reads the legacy local Chroma stores (vector_db/, preprocessed_db/). Only
    # needed by the R&D path -- generate_spanning.py and the one-off Chroma ->
    # Supabase migration script -- never by app.py or refresh_kb.py, so --no-dev
    # keeps it out of the image and both workflows.
    "chromadb>=1.4.0",
]
