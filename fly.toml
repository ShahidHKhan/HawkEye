# fly.toml app configuration file generated for hawkeye-newpaltz on 2026-07-18T00:38:11-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'hawkeye-newpaltz'
primary_region = 'yyz'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # Edge backstop in front of the app's own rate limits: past the soft limit Fly
  # prefers other machines (when there are any), past the hard limit it queues
  # requests instead of handing this 1 GB machine more than it can hold.
  [http_service.concurrency]
    type = 'requests'
    soft_limit = 50
    hard_limit = 100

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
