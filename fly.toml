# fly.toml app configuration file generated for hawkeye-newpaltz on 2026-07-18T00:38:11-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'hawkeye-newpaltz'
primary_region = 'yyz'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # Edge backstop in front of the app's own rate limits: past the soft limit Fly
  # prefers other machines (when there are any), past the hard limit it queues
  # requests instead of handing this 1 GB machine more than it can hold.
  [http_service.concurrency]
    type = 'requests'
    soft_limit = 50
    hard_limit = 100

# Database health, shown in the dashboard and `fly checks list`. Top-level rather
# than under [http_service] on purpose: a failing service check takes the machine
# out of routing, and with one machine that would replace HawkEye's own error
# messages with a proxy error. `fly deploy` also waits on it, so a deploy that
# can't reach Supabase (a bad SUPABASE_DB_URL) is reported as failed instead of
# looking fine. The alert itself is .github/workflows/uptime.yml.
[checks]
  [checks.database]
    type = 'http'
    port = 7860
    method = 'get'
    path = '/healthz'
    interval = '30s'
    timeout = '10s'
    grace_period = '60s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
